name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:win

      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in *.exe; do sha256sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: yuhox-board-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release/*.exe release/SHA256SUMS.txt \
            --title "Yuhox Board $TAG" \
            --notes-file "changelog/CHANGELOG-${TAG#v}.md" \
            --verify-tag
